[build]
publish = "public"
command = "npm run build"

[build.environment]
HUGO_VERSION = "0.164.0"
HUGO_EXTENDED = "true"
NODE_VERSION = "20"

[context.production.environment]
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"

[context.deploy-preview]
command = "npm run build"

[context.branch-deploy]
command = "npm run build"

# Canonical domain: autospotting.io. Redirect the .org aliases to it.
[[redirects]]
from = "https://autospotting.org/*"
to = "https://autospotting.io/:splat"
status = 301
force = true

[[redirects]]
from = "https://www.autospotting.org/*"
to = "https://autospotting.io/:splat"
status = 301
force = true

[[redirects]]
from = "https://www.autospotting.io/*"
to = "https://autospotting.io/:splat"
status = 301
force = true

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
for = "/images/*"

[headers.values]
Cache-Control = "public, max-age=604800"

# style.css is not fingerprinted, keep the TTL modest
[[headers]]
for = "/css/*"

[headers.values]
Cache-Control = "public, max-age=3600"
